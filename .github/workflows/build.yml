name: Build Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Download iOS SDKs
        run: |
          if [ -z "$(ls $HOME/theos/sdks 2>/dev/null)" ]; then
            cd $HOME/theos/sdks
            curl -sL -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
            # macOS 自带 unzip 创建 SDK 内符号链接会报 Permission denied；
            # 改用系统自带 bsdtar（libarchive），失败再退回 ditto。
            bsdtar -xf sdks.zip 2>/dev/null || ditto -x -k sdks.zip .
            mv sdks-master/*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
            rm -rf sdks.zip sdks-master
          fi
          ls $HOME/theos/sdks

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Build Tweak
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Collect Dylib Symbols
        run: |
          mkdir -p symbols
          find .theos -name 'DYYY.dylib' -exec cp {} symbols/ \;
          ls -la symbols || true

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: dyyy-deb
          path: packages/*.deb

      # 崩溃日志里的 imageOffset 只有配上这一份二进制才能定位到具体方法。
      - name: Upload Symbols
        uses: actions/upload-artifact@v4
        with:
          name: dyyy-symbols
          path: symbols/
          if-no-files-found: warn
